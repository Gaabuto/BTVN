# Filename matches spring.application.name = "delivery-service" so Spring Cloud Config Server
# serves this config to the delivery-service client (match pattern: {application}.yml).
spring:
  datasource:
    url: jdbc:mysql://foodx-cluster.local:3306/delivery_db
    username: delivery_service_user
    # PLACEHOLDER {cipher} value - generate the real ciphertext by POSTing the plaintext
    # password to the Config Server's /encrypt endpoint. Never store plaintext here.
    password: '{cipher}AQBxL4Zn9e2Hl7sQ5oPzT8uV3wY6zA8dB2fNgJ4iM7pR9sU1vX3yZ5aC7eG9hK1mO3qS5uW7y=='

server:
  port: 8087
