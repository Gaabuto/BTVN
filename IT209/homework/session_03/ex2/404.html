<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - Page Not Found</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);color:#333}
  .card{background:#fff;padding:40px;border-radius:16px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:400px}
  h1{font-size:96px;margin:0;color:#764ba2}
  a{display:inline-block;margin-top:20px;padding:10px 24px;background:#667eea;color:#fff;text-decoration:none;border-radius:8px}
</style>
</head>
<body>
  <div class="card">
    <h1>404</h1>
    <p>Oops! The page you are looking for does not exist.</p>
    <p>Please check the URL and try again.</p>
    <a href="/">Back to Home</a>
  </div>
</body>
</html>
